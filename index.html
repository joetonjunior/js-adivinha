<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bia Advinha</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-red-700 h-screen flex justify-center items-center">
    
    <div class="w-125 bg-white rounded p-4">
        <div class="flex">
            <h1 class="text-[48px] font-semibold">
                Em que numero <span class="text-amber-500">Bia</span> está pensando?
            </h1>
            <img id="bia" src="./assets/bia.png" alt="Bia">
        </div>
        <div class="w-125 relative">
          <div>
            <input onchange="receberPalpite(event.target)" type="text" class="w-15 h-15 border-2 border-slate-300 focus:border-red-700 rounded m-auto my-4 text-center block text-lg">
          </div>
          <div id="butaovermei" class = "hidden absolute top-0 transition-200ms w-125 h-40">
            <button onclick="restart()" class = "bg-red-700 text-white w-100 h-18">Jogar novamente</button>
          </div>
        </div>
        <h3 id="textofinal" class="font-bold text-center"><span id="resultadofinal" class="text-amber-500"></span></h3>
        <h6 class="font-bold text-center">Seus palpites</h6>
        <h2 id="palpites" class="text-center text-lg text-amber-500 font-bold"></h2>
    </div>

    <script src="index.js"></script>
</body>
</html>
